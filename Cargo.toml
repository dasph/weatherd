[package]
name = "weatherd"
version = "0.1.0"
edition = "2024"
description = "Scrapes the pogoda.interia.pl hourly forecast and pushes it to a Home Assistant webhook"
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10.4"
ctrlc = { version = "3.5.3", features = ["termination"] }
humantime = "2.4.0"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.2", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
